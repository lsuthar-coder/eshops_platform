name: Deploy eShops Admin

on:
  push:
    branches:
      - main
    paths:
      - "backend/admin-api/**"
      - "frontend/admin-ui/**"
      - "k8s/admin-api/**"
      - "k8s/admin-ui/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend/admin-api
          file: ./backend/admin-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lsuthar-coder/admin-api:latest
            ghcr.io/lsuthar-coder/admin-api:${{ github.sha }}

      - name: Build and push admin-ui
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/admin-ui
          file: ./frontend/admin-ui/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://admin-api.eshops.lsuthar.in
          tags: |
            ghcr.io/lsuthar-coder/admin-ui:latest
            ghcr.io/lsuthar-coder/admin-ui:${{ github.sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBECONFIG }}' > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespace eshops

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/admin-api/ -n eshops
          kubectl apply -f k8s/admin-ui/ -n eshops

      - name: Update admin-api image
        run: |
          kubectl set image deployment/admin-api \
            admin-api=ghcr.io/lsuthar-coder/admin-api:${{ github.sha }} \
            -n eshops

      - name: Update admin-ui image
        run: |
          kubectl set image deployment/admin-ui \
            admin-ui=ghcr.io/lsuthar-coder/admin-ui:${{ github.sha }} \
            -n eshops

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/admin-api \
            --timeout=180s \
            -n eshops

          kubectl rollout status deployment/admin-ui \
            --timeout=180s \
            -n eshops

      - name: Verify deployment
        run: |
          kubectl get deployments -n eshops
          kubectl get pods -n eshops
          kubectl get services -n eshops
          kubectl get ingress -n eshops
          kubectl get hpa -n eshops
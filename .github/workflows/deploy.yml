name: Deploy eShops

on:
  push:
    branches:
      - main
    paths:
      - "backend/portal-api/**"
      - "frontend/portal-ui/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push portal-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend/portal-api
          file: ./backend/portal-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lsuthar-coder/portal-api:latest
            ghcr.io/lsuthar-coder/portal-api:${{ github.sha }}

      - name: Build and push portal-ui
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/portal-ui
          file: ./frontend/portal-ui/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://portal-api.eshops.lsuthar.in
          tags: |
            ghcr.io/lsuthar-coder/portal-ui:latest
            ghcr.io/lsuthar-coder/portal-ui:${{ github.sha }}

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBECONFIG }}' > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get namespace eshops

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/portal-api/ -n eshops
          kubectl apply -f k8s/portal-ui/ -n eshops

      - name: Update portal-api image
        run: |
          kubectl set image deployment/portal-api \
            portal-api=ghcr.io/lsuthar-coder/portal-api:${{ github.sha }} \
            -n eshops

      - name: Update portal-ui image
        run: |
          kubectl set image deployment/portal-ui \
            portal-ui=ghcr.io/lsuthar-coder/portal-ui:${{ github.sha }} \
            -n eshops

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/portal-api \
            --timeout=180s \
            -n eshops

          kubectl rollout status deployment/portal-ui \
            --timeout=180s \
            -n eshops

      - name: Verify deployment
        run: |
          kubectl get deployments -n eshops
          kubectl get pods -n eshops
          kubectl get services -n eshops
          kubectl get ingress -n eshops
          kubectl get hpa -n eshops
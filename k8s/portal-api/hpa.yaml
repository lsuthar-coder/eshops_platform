apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portal-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-api

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300

    scaleDown:
      stabilizationWindowSeconds: 300
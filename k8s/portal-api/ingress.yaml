apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-api
  namespace: eshops
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - portal-api.eshops.lsuthar.in
      secretName: eshops-wildcard-tls

  rules:
    - host: portal-api.eshops.lsuthar.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-api
                port:
                  number: 3000